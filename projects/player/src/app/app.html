@if (isStandalone) {
  <div class="standalone-bar">
    <button mat-stroked-button (click)="fileInput.click()">
      load unit
    </button>
    <input #fileInput type="file" accept=".json" hidden (change)="loadUnitFromFile(fileInput)" />
  </div>
}

@if (unit(); as currentUnit) {
  @switch (currentUnit.viewType) {
    @case ('WELCOME') {
      <syscheck-player-welcome />
    }
    @case ('SYSTEM') {
      <syscheck-player-system-check
        [viewParameters]="systemContextViewParameters"
        [messages]="systemCheckMessages"
        (stateChanged)="onSystemCheckStateChanged($event)"
        (nextStep)="onNextStep()"
      />
    }
    @case ('NETWORK') {
      <syscheck-player-network-check
        [viewParameters]="networkViewParameters"
        [directDownloadUrl]="resourceURL"
        (nextStep)="onNextStep()"
      />
    }
    @default {
      <p>Unsupported view type: {{ currentUnit.viewType }}</p>
    }
  }
} @else if (isStandalone) {
  <p>Load a unit definition to get started.</p>
}
